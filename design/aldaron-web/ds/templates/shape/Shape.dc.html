<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Formes Aldaron" description="Rayons, bordures, ombres et hauteur des contrôles : aperçu en direct." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0}a{color:var(--brand-text)}a:hover{color:var(--foreground)}button{font-family:inherit}</style></helmet>
<div class="{{ themeClass }}" style="background:var(--background);color:var(--foreground);font-family:var(--font-sans);min-height:100vh;padding:24px 16px 120px"><div ref="{{ frameRef }}" style="width:1200px;max-width:100%;margin:0 auto">
<header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--border)"><span style="font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)">Aldaron · {{ t.kicker }}</span></header>
<div style="padding:36px 0 28px;display:grid;gap:12px"><h1 style="margin:0;font:700 clamp(32px,6vw,56px)/1.02 var(--font-display);letter-spacing:-0.03em;text-wrap:balance">{{ t.title }}</h1><p style="margin:0;font-size:18px;line-height:1.55;color:var(--muted-foreground);max-width:62ch">{{ t.subtitle }}</p></div>

<div ref="{{ rootRef }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
<section style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:grid;gap:14px;align-content:start;"><div style="font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)">{{ t.card }}</div><div style="background:var(--card);border:var(--sh-b,1px) solid var(--border);border-radius:var(--sh-r,6px);padding:20px;display:grid;gap:8px;box-shadow:var(--sh-s,none)"><span style="font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)">Socle</span><b style="font:700 28px/1 var(--font-display);letter-spacing:-0.02em">5 000 €</b><span style="height:24px;width:max-content;padding:0 10px;border-radius:var(--sh-r,6px);background:var(--accent);color:var(--accent-foreground);display:flex;align-items:center;font:500 12px var(--font-sans)">Inclus</span></div></section>
<section style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:grid;gap:14px;align-content:start;"><div style="font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)">{{ t.controls }}</div><input type="text" placeholder="vous@startup.eu" aria-label="Email" style="height:var(--sh-h,44px);padding:0 14px;border:var(--sh-b,1px) solid var(--input);border-radius:var(--sh-r,6px);background:var(--background);color:var(--foreground);font:400 15px var(--font-sans)" style-focus="outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 22%,transparent)"><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" style="height:var(--sh-h,44px);padding:0 18px;border:var(--sh-b,1px) solid transparent;border-radius:var(--sh-r,6px);background:var(--primary);color:var(--primary-foreground);font:500 15px var(--font-sans);cursor:pointer" style-hover="filter:brightness(1.15)" style-focus="outline:2px solid var(--ring);outline-offset:2px" style-active="transform:translateY(1px)">Envoyer</button><button type="button" style="height:var(--sh-h,44px);padding:0 18px;border:var(--sh-b,1px) solid var(--input);border-radius:var(--sh-r,6px);background:transparent;color:var(--foreground);font:500 15px var(--font-sans);cursor:pointer" style-hover="background:var(--muted)" style-focus="outline:2px solid var(--ring);outline-offset:2px" style-active="transform:translateY(1px)">Annuler</button></div></section>
<section style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:grid;gap:14px;align-content:start;"><div style="font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)">{{ t.overlay }}</div><div style="background:var(--popover);border:var(--sh-b,1px) solid var(--border);border-radius:calc(var(--sh-r,6px) + 4px);padding:20px;display:grid;gap:8px;box-shadow:var(--sh-s,none)"><b style="font:700 18px var(--font-display)">Supprimer cet utilisateur ?</b><span style="font-size:14px;color:var(--muted-foreground);line-height:1.5">Il perd l'accès au back-office immédiatement.</span></div></section>
<section style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:grid;gap:14px;align-content:start;"><div style="font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)">{{ t.values }}</div><code style="font:400 13px/1.8 var(--font-mono);color:var(--muted-foreground);white-space:pre-wrap">{{ valuesText }}</code></section>
</div>
</div></div>
<aside aria-label="Tweaks" class="{{ themeClass }}" style="position:fixed;right:16px;bottom:16px;z-index:50;width:min(320px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg)">
<button type="button" onClick="{{ togglePanel }}" aria-expanded="{{ open }}" style="width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:none;border:0;color:inherit;font:600 14px/1 var(--font-sans);cursor:pointer;border-radius:12px" style-hover="background:var(--muted)" style-focus="outline:2px solid var(--ring);outline-offset:-2px">Tweaks<span style="font:500 12px var(--font-mono);color:var(--muted-foreground)">{{ panelSign }}</span></button>
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}"><div style="padding:4px 16px 16px;display:grid;gap:14px;border-top:1px solid var(--border)">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="4"><div style="display:grid;gap:6px;padding-top:10px"><span style="font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)">{{ g.title }}</span><div style="display:flex;gap:4px;flex-wrap:wrap"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="3"><sc-if value="{{ o.active }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ o.on }}" aria-pressed="true" style="min-height:36px;padding:0 12px;border-radius:6px;font:500 13px/1 var(--font-sans);cursor:pointer;border:1px solid transparent;background:var(--primary);color:var(--primary-foreground)" style-hover="filter:brightness(.96)" style-focus="outline:2px solid var(--ring);outline-offset:2px">{{ o.label }}</button></sc-if><sc-if value="{{ o.idle }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ o.on }}" aria-pressed="false" style="min-height:36px;padding:0 12px;border-radius:6px;font:500 13px/1 var(--font-sans);cursor:pointer;border:1px solid var(--input);background:transparent;color:var(--foreground)" style-hover="background:var(--muted)" style-focus="outline:2px solid var(--ring);outline-offset:2px">{{ o.label }}</button></sc-if></sc-for></div></div></sc-for>
<sc-for list="{{ ranges }}" as="r" hint-placeholder-count="1"><label style="display:grid;gap:6px"><span style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted-foreground)"><span>{{ r.title }}</span><span style="font-family:var(--font-mono)">{{ r.label }}</span></span><input type="range" min="{{ r.min }}" max="{{ r.max }}" step="{{ r.step }}" value="{{ r.val }}" onInput="{{ r.on }}" style="width:100%;height:44px;accent-color:var(--brand)"></label></sc-for>
</div></sc-if></aside>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = Object.assign({ theme: 'light', lang: 'fr', bp: 'desktop', open: true, copied: '' }, {"radius":6,"border":1,"shadow":"none","ctl":44});
  CT = {"fr":{"theme":"Thème","light":"Clair","dark":"Sombre","lang":"Langue","bp":"Largeur","mobile":"Mobile","tablet":"Tablette","desktop":"Desktop","large":"Grand desktop"},"en":{"theme":"Theme","light":"Light","dark":"Dark","lang":"Language","bp":"Width","mobile":"Mobile","tablet":"Tablet","desktop":"Desktop","large":"Large desktop"},"mg":{"theme":"Endrika","light":"Mazava","dark":"Maizina","lang":"Fiteny","bp":"Sakany","mobile":"Finday","tablet":"Takelaka","desktop":"Solosaina","large":"Solosaina lehibe"}};
  PT = {"fr":{"kicker":"Formes","title":"Formes","subtitle":"Petits rayons, bordures fines, ombres réservées à ce qui flotte. Faites varier les réglages pour voir l'effet sur les composants.","card":"Carte","controls":"Contrôles","overlay":"Surcouche","values":"Valeurs retenues","gRadius":"Rayon","gBorder":"Bordure","gShadow":"Ombre","gCtl":"Hauteur des contrôles","none":"Aucune","sm":"Petite","md":"Moyenne","lg":"Grande"},"en":{"kicker":"Shape","title":"Shape","subtitle":"Small radii, thin borders, shadows only for what floats. Change the settings to see the effect on components.","card":"Card","controls":"Controls","overlay":"Overlay","values":"Chosen values","gRadius":"Radius","gBorder":"Border","gShadow":"Shadow","gCtl":"Control height","none":"None","sm":"Small","md":"Medium","lg":"Large"},"mg":{"kicker":"Endrika","title":"Endrika","subtitle":"Efamira kely, sisiny manify, aloka ho an'ny zavatra mitsingevana ihany. Ovay ny fandrindrana mba hahitana ny vokany.","card":"Karatra","controls":"Fanaraha-maso","overlay":"Sarona","values":"Sanda voafidy","gRadius":"Efamira","gBorder":"Sisiny","gShadow":"Aloka","gCtl":"Haavon ny fanaraha-maso","none":"Tsy misy","sm":"Kely","md":"antonony","lg":"Lehibe"}};
  frameRef = (el) => { this.frameEl = el; };
  paintAll() { if (this.frameEl) this.frameEl.style.width = { mobile: 390, tablet: 768, desktop: 1200, large: 1600 }[this.state.bp] + 'px'; if (this.paint) this.paint(); }
  componentDidMount() { this.paintAll(); if (this.mounted) this.mounted(); }
  componentDidUpdate() { this.paintAll(); }
  tr() { return Object.assign({}, this.CT[this.state.lang], this.PT[this.state.lang]); }
  G(title, key, list, T) { return { title: title, opts: list.map((p) => { const on = this.state[key] === p[0]; return { label: T[p[1]] || p[1], on: () => this.setState({ [key]: p[0] }), active: on, idle: !on }; }) }; }
  baseGroups(T) { return [this.G(T.theme, 'theme', [['light', 'light'], ['dark', 'dark']], T), this.G(T.lang, 'lang', [['fr', 'FR'], ['en', 'EN'], ['mg', 'MG']], T), this.G(T.bp, 'bp', [['mobile', 'mobile'], ['tablet', 'tablet'], ['desktop', 'desktop'], ['large', 'large']], T)]; }
  common(T) { const s = this.state; return { themeClass: s.theme === 'dark' ? 'dark' : '', t: T, frameRef: this.frameRef, open: s.open, panelSign: s.open ? '−' : '+', togglePanel: () => this.setState({ open: !s.open }) }; }
  range(title, label, val, min, max, step, fn) { return { title: title, label: label, val: val, min: min, max: max, step: step, on: (e) => fn(+e.target.value) }; }
  copyText(txt, key) { const done = () => { this.setState({ copied: key }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ copied: '' }), 1600); }; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done); else { const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); done(); } }
  rootRef = (el) => { this.root = el; };
  paint() { const s = this.state; if (this.root) { const st = this.root.style; st.setProperty('--sh-r', s.radius + 'px'); st.setProperty('--sh-b', s.border + 'px'); st.setProperty('--sh-s', s.shadow === 'none' ? 'none' : 'var(--shadow-' + s.shadow + ')'); st.setProperty('--sh-h', s.ctl + 'px'); } }
  renderVals() {
    const s = this.state; const T = this.tr();
    const g = [this.G(T.gRadius, 'radius', [[0, '0'], [4, '4'], [6, '6'], [8, '8'], [12, '12'], [16, '16'], [999, '999']], T), this.G(T.gBorder, 'border', [[1, '1 px'], [2, '2 px']], T), this.G(T.gShadow, 'shadow', [['none', 'none'], ['sm', 'sm'], ['md', 'md'], ['lg', 'lg']], T), this.G(T.gCtl, 'ctl', [[36, '36'], [44, '44'], [52, '52']], T)];
    return Object.assign(this.common(T), { groups: g.concat(this.baseGroups(T)), ranges: [], rootRef: this.rootRef, valuesText: '--radius: ' + s.radius + 'px\n--border-width: ' + s.border + 'px\n--shadow: ' + s.shadow + '\n--control-h: ' + s.ctl + 'px\n\nActuel : 6 px · 1 px · aucune · 44 px' });
  }
}
</script>
</body>
</html>

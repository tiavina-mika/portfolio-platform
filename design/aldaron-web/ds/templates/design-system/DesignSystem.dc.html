<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Système de design Aldaron" description="Direction retenue : Précision chaleureuse. Palette, type, formes et composants avec leurs états." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0}a{color:var(--brand-text)}a:hover{color:var(--foreground)}button{font-family:inherit}</style></helmet>
<div class="{{ themeClass }}" style="background:var(--background);color:var(--foreground);font-family:var(--font-sans);min-height:100vh;padding:24px 16px 120px"><div ref="{{ frameRef }}" style="width:1200px;max-width:100%;margin:0 auto">
<header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--border)"><span style="font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)">Aldaron · {{ t.kicker }}</span></header>
<div style="padding:36px 0 28px;display:grid;gap:12px"><h1 style="margin:0;font:700 clamp(32px,6vw,56px)/1.02 var(--font-display);letter-spacing:-0.03em;text-wrap:balance">{{ t.title }}</h1><p style="margin:0;font-size:18px;line-height:1.55;color:var(--muted-foreground);max-width:62ch">{{ t.subtitle }}</p></div>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
<section style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:grid;gap:14px;align-content:start;"><div style="font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)">{{ t.kw }}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><span style="height:28px;padding:0 12px;border-radius:99px;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;font:500 13px var(--font-sans)">{{ t.k1 }}</span><span style="height:28px;padding:0 12px;border-radius:99px;background:var(--accent);color:var(--accent-foreground);display:flex;align-items:center;font:500 13px var(--font-sans)">{{ t.k2 }}</span><span style="height:28px;padding:0 12px;border-radius:99px;border:1px solid var(--input);display:flex;align-items:center;font:500 13px var(--font-sans)">{{ t.k3 }}</span></div><p style="margin:0;font-size:15px;line-height:1.55;color:var(--muted-foreground)">{{ t.kwText }}</p></section>
<section style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:grid;gap:14px;align-content:start;"><div style="font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)">{{ t.palette }}</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px"><div style="height:56px;border-radius:6px;background:var(--ink-900);border:1px solid var(--border)"></div><div style="height:56px;border-radius:6px;background:var(--paper-50);border:1px solid var(--border)"></div><div style="height:56px;border-radius:6px;background:var(--signal-500);border:1px solid var(--border)"></div><div style="height:56px;border-radius:6px;background:var(--forest-700);border:1px solid var(--border)"></div><div style="height:56px;border-radius:6px;background:var(--sand-500);border:1px solid var(--border)"></div><div style="height:56px;border-radius:6px;background:var(--stone-200);border:1px solid var(--border)"></div></div><div style="font:700 34px/1.05 var(--font-display);letter-spacing:-0.03em">Livré vite, prix prévisible.</div><div style="font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)">Familjen Grotesk · IBM Plex Mono</div></section>
<section style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:grid;gap:14px;align-content:start;grid-column:1/-1"><div style="font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)">{{ t.comp }}</div><div style="display:grid;gap:14px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><x-import component-from-global-scope="AldaronDesignSystem_1daf3c.Button" variant="{{ btnVariant }}" forceState="{{ forceState }}" disabled="{{ isDisabled }}" loading="{{ isLoading }}" hint-size="170px,44px">{{ t.btn }}</x-import><x-import component-from-global-scope="AldaronDesignSystem_1daf3c.Badge" variant="success" dot="{{ true }}" hint-size="80px,24px">{{ t.ok }}</x-import></div><x-import component-from-global-scope="AldaronDesignSystem_1daf3c.Input" placeholder="vous@startup.eu" forceState="{{ forceState }}" disabled="{{ isDisabled }}" invalid="{{ isInvalid }}" hint-size="100%,44px"></x-import><x-import component-from-global-scope="AldaronDesignSystem_1daf3c.Alert" variant="{{ alertVariant }}" title="{{ t.alertTitle }}" hint-size="100%,60px">{{ t.alertBody }}</x-import></div></section>
</div>
</div></div>
<aside aria-label="Tweaks" class="{{ themeClass }}" style="position:fixed;right:16px;bottom:16px;z-index:50;width:min(320px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg)">
<button type="button" onClick="{{ togglePanel }}" aria-expanded="{{ open }}" style="width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:none;border:0;color:inherit;font:600 14px/1 var(--font-sans);cursor:pointer;border-radius:12px" style-hover="background:var(--muted)" style-focus="outline:2px solid var(--ring);outline-offset:-2px">Tweaks<span style="font:500 12px var(--font-mono);color:var(--muted-foreground)">{{ panelSign }}</span></button>
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}"><div style="padding:4px 16px 16px;display:grid;gap:14px;border-top:1px solid var(--border)">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="4"><div style="display:grid;gap:6px;padding-top:10px"><span style="font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)">{{ g.title }}</span><div style="display:flex;gap:4px;flex-wrap:wrap"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="3"><sc-if value="{{ o.active }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ o.on }}" aria-pressed="true" style="min-height:36px;padding:0 12px;border-radius:6px;font:500 13px/1 var(--font-sans);cursor:pointer;border:1px solid transparent;background:var(--primary);color:var(--primary-foreground)" style-hover="filter:brightness(.96)" style-focus="outline:2px solid var(--ring);outline-offset:2px">{{ o.label }}</button></sc-if><sc-if value="{{ o.idle }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ o.on }}" aria-pressed="false" style="min-height:36px;padding:0 12px;border-radius:6px;font:500 13px/1 var(--font-sans);cursor:pointer;border:1px solid var(--input);background:transparent;color:var(--foreground)" style-hover="background:var(--muted)" style-focus="outline:2px solid var(--ring);outline-offset:2px">{{ o.label }}</button></sc-if></sc-for></div></div></sc-for>
<sc-for list="{{ ranges }}" as="r" hint-placeholder-count="1"><label style="display:grid;gap:6px"><span style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted-foreground)"><span>{{ r.title }}</span><span style="font-family:var(--font-mono)">{{ r.label }}</span></span><input type="range" min="{{ r.min }}" max="{{ r.max }}" step="{{ r.step }}" value="{{ r.val }}" onInput="{{ r.on }}" style="width:100%;height:44px;accent-color:var(--brand)"></label></sc-for>
</div></sc-if></aside>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = Object.assign({ theme: 'light', lang: 'fr', bp: 'desktop', open: true, copied: '' }, {"btn":"primary","st":"normal"});
  CT = {"fr":{"theme":"Thème","light":"Clair","dark":"Sombre","lang":"Langue","bp":"Largeur","mobile":"Mobile","tablet":"Tablette","desktop":"Desktop","large":"Grand desktop"},"en":{"theme":"Theme","light":"Light","dark":"Dark","lang":"Language","bp":"Width","mobile":"Mobile","tablet":"Tablet","desktop":"Desktop","large":"Large desktop"},"mg":{"theme":"Endrika","light":"Mazava","dark":"Maizina","lang":"Fiteny","bp":"Sakany","mobile":"Finday","tablet":"Takelaka","desktop":"Solosaina","large":"Solosaina lehibe"}};
  PT = {"fr":{"kicker":"Direction","title":"Précision chaleureuse","subtitle":"Un cahier des charges rendu visible, sur un papier chaud : la rigueur de l'ingénierie, l'accueil d'un partenaire, un orange pour l'audace.","kw":"Mots-clés","k1":"Ingénierie","k2":"Chaleureux","k3":"Audacieux","kwText":"Grille et mono pour la rigueur, papier et pierre pour la chaleur, un seul orange Signal pour l'audace. Thème clair par défaut, thème sombre complet.","palette":"Palette et typographie","comp":"Composants et états","gBtn":"Bouton","gState":"État","primary":"Principal","brand":"Marque","outline":"Contour","ghost":"Discret","destructive":"Danger","normal":"Normal","hover":"Survol","focus":"Focus","disabled":"Désactivé","loading":"Chargement","error":"Erreur","btn":"Demander un devis","ok":"Actif","alertTitle":"Préproduction prête","alertBody":"Votre lien de recette est disponible.","alertErr":"Adresse email invalide"},"en":{"kicker":"Direction","title":"Warm precision","subtitle":"A spec sheet made visible, on warm paper: engineering rigour, a partner's welcome, and one orange for boldness.","kw":"Keywords","k1":"Engineering","k2":"Warm","k3":"Bold","kwText":"Grid and mono for rigour, paper and stone for warmth, a single Signal orange for boldness. Light theme by default, full dark theme.","palette":"Palette and type","comp":"Components and states","gBtn":"Button","gState":"State","primary":"Primary","brand":"Brand","outline":"Outline","ghost":"Ghost","destructive":"Danger","normal":"Normal","hover":"Hover","focus":"Focus","disabled":"Disabled","loading":"Loading","error":"Error","btn":"Request a quote","ok":"Active","alertTitle":"Staging is ready","alertBody":"Your review link is available.","alertErr":"Invalid email address"},"mg":{"kicker":"Làlana","title":"Fahitsiana mafana","subtitle":"Taratasy mazava amin ny fepetra, amin ny taratasy mafana: ny hamafin ny injeniera, ny fandraisana ny mpiara-miasa, ary loko mena iray ho an ny herim-po.","kw":"Teny fototra","k1":"Injeniera","k2":"Mafana","k3":"Sahy","kwText":"Kitay sy mono ho an ny hamafin-toetra, taratasy sy vato ho an ny hafanana, Signal mena iray ho an ny herim-po.","palette":"Palette sy soratra","comp":"Singa sy toe-javatra","gBtn":"Bokotra","gState":"Toe-javatra","primary":"Voalohany","brand":"Marika","outline":"Sisiny","ghost":"Malefaka","destructive":"Loza","normal":"Mahazatra","hover":"Eo ambony","focus":"Fifantohana","disabled":"Tsy mandeha","loading":"Mandalo","error":"Diso","btn":"Mangataka tolo-vidiny","ok":"Mandeha","alertTitle":"Vonona ny preprod","alertBody":"Misy ny rohy fanamarinana.","alertErr":"Tsy mety ny adiresy mailaka"}};
  frameRef = (el) => { this.frameEl = el; };
  paintAll() { if (this.frameEl) this.frameEl.style.width = { mobile: 390, tablet: 768, desktop: 1200, large: 1600 }[this.state.bp] + 'px'; if (this.paint) this.paint(); }
  componentDidMount() { this.paintAll(); if (this.mounted) this.mounted(); }
  componentDidUpdate() { this.paintAll(); }
  tr() { return Object.assign({}, this.CT[this.state.lang], this.PT[this.state.lang]); }
  G(title, key, list, T) { return { title: title, opts: list.map((p) => { const on = this.state[key] === p[0]; return { label: T[p[1]] || p[1], on: () => this.setState({ [key]: p[0] }), active: on, idle: !on }; }) }; }
  baseGroups(T) { return [this.G(T.theme, 'theme', [['light', 'light'], ['dark', 'dark']], T), this.G(T.lang, 'lang', [['fr', 'FR'], ['en', 'EN'], ['mg', 'MG']], T), this.G(T.bp, 'bp', [['mobile', 'mobile'], ['tablet', 'tablet'], ['desktop', 'desktop'], ['large', 'large']], T)]; }
  common(T) { const s = this.state; return { themeClass: s.theme === 'dark' ? 'dark' : '', t: T, frameRef: this.frameRef, open: s.open, panelSign: s.open ? '−' : '+', togglePanel: () => this.setState({ open: !s.open }) }; }
  range(title, label, val, min, max, step, fn) { return { title: title, label: label, val: val, min: min, max: max, step: step, on: (e) => fn(+e.target.value) }; }
  copyText(txt, key) { const done = () => { this.setState({ copied: key }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ copied: '' }), 1600); }; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done); else { const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); done(); } }
  renderVals() {
    const s = this.state; const T = this.tr(); const st = s.st;
    const g = [this.G(T.gBtn, 'btn', [['primary', 'primary'], ['brand', 'brand'], ['outline', 'outline'], ['ghost', 'ghost'], ['destructive', 'destructive']], T), this.G(T.gState, 'st', [['normal', 'normal'], ['hover', 'hover'], ['focus', 'focus'], ['disabled', 'disabled'], ['loading', 'loading'], ['error', 'error']], T)];
    return Object.assign(this.common(T), { groups: g.concat(this.baseGroups(T)), ranges: [], btnVariant: s.btn, forceState: st === 'hover' || st === 'focus' ? st : undefined, isDisabled: st === 'disabled', isLoading: st === 'loading', isInvalid: st === 'error', alertVariant: st === 'error' ? 'destructive' : 'info', t: Object.assign({}, T, st === 'error' ? { alertTitle: T.alertErr, alertBody: T.alertErr } : {}) });
  }
}
</script>
</body>
</html>

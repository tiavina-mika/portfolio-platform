<!-- @dsCard group="Colors" viewport="700x150" name="Chart colors" subtitle="--chart-1 à --chart-5, dans cet ordre" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--background)}.l{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--muted-foreground)}code,.m{font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)}.b{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;align-items:end;height:120px}</style></head><body><div class="b"><div style="display:grid;gap:6px"><i style="height:96px;background:var(--chart-1);border-radius:3px 3px 0 0;display:block"></i><code>--chart-1</code></div><div style="display:grid;gap:6px"><i style="height:72px;background:var(--chart-2);border-radius:3px 3px 0 0;display:block"></i><code>--chart-2</code></div><div style="display:grid;gap:6px"><i style="height:56px;background:var(--chart-3);border-radius:3px 3px 0 0;display:block"></i><code>--chart-3</code></div><div style="display:grid;gap:6px"><i style="height:40px;background:var(--chart-4);border-radius:3px 3px 0 0;display:block"></i><code>--chart-4</code></div><div style="display:grid;gap:6px"><i style="height:28px;background:var(--chart-5);border-radius:3px 3px 0 0;display:block"></i><code>--chart-5</code></div></div></body></html>

<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--background)}.l{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--muted-foreground)}code,.m{font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)}</style></head><body><div id="ic" style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;color:var(--foreground)"></div><div class="m" style="margin-top:14px">lucide-react · strokeWidth 1.75 · 16 (dense) / 20 (défaut) / 24 (marketing) · currentColor</div><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script>const n=['lock-keyhole','shield-check','users','key-round','file-text','layout-dashboard','bell','mail','message-square','globe','rocket','settings'];document.getElementById('ic').innerHTML=n.map(i=>'<div style="display:grid;justify-items:center;gap:6px"><i data-lucide="'+i+'"></i></div>').join('');lucide.createIcons({attrs:{'stroke-width':1.75,width:22,height:22}});</script></body></html>

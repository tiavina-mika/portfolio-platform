<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--background)}.l{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--muted-foreground)}code,.m{font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px"><div style="display:grid;gap:8px"><span style="height:44px;border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px;">Valider</span><code>Normal</code></div><div style="display:grid;gap:8px"><span style="height:44px;border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px;background:var(--ink-800)">Valider</span><code>Survol</code></div><div style="display:grid;gap:8px"><span style="height:44px;border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px;box-shadow:var(--focus-ring)">Valider</span><code>Focus</code></div><div style="display:grid;gap:8px"><span style="height:44px;border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px;opacity:var(--disabled-opacity)">Valider</span><code>Désactivé</code></div><div style="display:grid;gap:8px"><span style="height:44px;border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px;transform:translateY(1px);background:var(--ink-950)">Valider</span><code>Pressé</code></div></div></body></html>

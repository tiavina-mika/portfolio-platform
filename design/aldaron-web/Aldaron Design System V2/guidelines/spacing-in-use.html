<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--background)}.l{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--muted-foreground)}code,.m{font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px"><div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6);display:grid;gap:var(--space-4);outline:1px dashed var(--signal-400);outline-offset:-24px"><div style="font-weight:700;font-size:20px">Écran back-office</div><div style="color:var(--muted-foreground);font-size:14px">Liste + formulaire standard</div><div style="display:flex;gap:var(--space-2)"><span class="m" style="background:var(--muted);padding:4px 8px;border-radius:4px">40 €</span><span class="m" style="background:var(--muted);padding:4px 8px;border-radius:4px">×1</span></div></div><div style="display:grid;gap:8px;align-content:center" class="m"><div>padding — <b style="color:var(--foreground)">--space-6 · 24</b></div><div>pile verticale — <b style="color:var(--foreground)">--space-4 · 16</b></div><div>groupe inline — <b style="color:var(--foreground)">--space-2 · 8</b></div><div>sections de page — <b style="color:var(--foreground)">--space-24 · 96</b></div></div></div></body></html>

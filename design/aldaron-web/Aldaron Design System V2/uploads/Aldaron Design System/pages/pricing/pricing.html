<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aldaron · Offre et prix</title>
<style>
/* ==========================================================================
   1. VARIABLES — jetons du système de design Aldaron (clair :root, sombre .dark)
   ========================================================================== */
@font-face{font-family:'Familjen Grotesk';font-weight:400;font-display:swap;src:url('../../assets/fonts/familjen-grotesk-400.woff2') format('woff2')}
@font-face{font-family:'Familjen Grotesk';font-weight:500;font-display:swap;src:url('../../assets/fonts/familjen-grotesk-500.woff2') format('woff2')}
@font-face{font-family:'Familjen Grotesk';font-weight:600;font-display:swap;src:url('../../assets/fonts/familjen-grotesk-600.woff2') format('woff2')}
@font-face{font-family:'Familjen Grotesk';font-weight:700;font-display:swap;src:url('../../assets/fonts/familjen-grotesk-700.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url('../../assets/fonts/ibm-plex-mono-400.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url('../../assets/fonts/ibm-plex-mono-500.woff2') format('woff2')}
:root{
  --ink-950:#0E0F0D;--ink-900:#17181A;
  --stone-600:#5E5A54;--stone-400:#A19B92;--stone-300:#CFC8BD;--stone-200:#E3DED5;--stone-100:#EEEAE3;
  --paper-50:#F6F3EE;--paper-0:#FFFFFF;
  --signal-700:#B4400F;--signal-500:#E2531B;--signal-400:#F26A33;--signal-50:#FDF1EA;
  --green-700:#1E6B47;--green-400:#5BC58B;--red-700:#B42318;--red-400:#F26B5E;
  --background:var(--paper-50);--foreground:var(--ink-900);
  --card:var(--paper-0);--card-foreground:var(--ink-900);
  --popover:var(--paper-0);--popover-foreground:var(--ink-900);
  --primary:var(--ink-900);--primary-foreground:var(--paper-50);
  --muted:var(--stone-100);--muted-foreground:var(--stone-600);
  --brand:var(--signal-500);--brand-foreground:var(--ink-900);--brand-text:var(--signal-700);
  --destructive:var(--red-700);--success:var(--green-700);
  --border:var(--stone-200);--input:var(--stone-300);--ring:var(--signal-500);
  --font-sans:'Familjen Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-display:'Familjen Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;--space-20:80px;
  --radius-md:6px;--radius-lg:8px;--radius-xl:12px;
  --shadow-lg:0 16px 40px -8px rgba(23,24,26,.16),0 4px 12px rgba(23,24,26,.06);
  --focus-ring:0 0 0 2px var(--background),0 0 0 4px var(--ring);
  --hit-min:44px;--control-h-sm:36px;--control-h:44px;--control-h-lg:52px;
  --disabled-opacity:.45;
  --ease-out:cubic-bezier(.2,.7,.2,1);--dur-fast:120ms;
}
.dark{
  --background:#121311;--foreground:var(--stone-100);
  --card:#1A1C19;--card-foreground:var(--stone-100);
  --popover:#1F211D;--popover-foreground:var(--stone-100);
  --primary:var(--stone-100);--primary-foreground:var(--ink-900);
  --muted:#232521;--muted-foreground:var(--stone-400);
  --brand:var(--signal-400);--brand-foreground:var(--ink-950);--brand-text:var(--signal-400);
  --destructive:var(--red-400);--success:var(--green-400);
  --border:#2C2D29;--input:#3A3B36;--ring:var(--signal-400);
  --shadow-lg:0 16px 40px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;background:var(--muted);color:var(--foreground);font:400 16px/1.55 var(--font-sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd,figure,fieldset{margin:0;padding:0}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
a{color:var(--brand-text)}
a:hover{color:var(--foreground)}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ==========================================================================
   3. PAGE — cadre de largeur (tweak « Largeur ») et mise en page des sections
   ========================================================================== */
.frame{container:page / inline-size;background:var(--background);margin-inline:auto;width:100%;max-width:1200px;min-height:100vh;border-inline:1px solid var(--border)}
[data-bp=mobile] .frame{max-width:390px}
[data-bp=tablet] .frame{max-width:768px}
[data-bp=desktop] .frame{max-width:1200px}
[data-bp=large] .frame{max-width:1600px}
.wrap{padding-inline:var(--space-5)}
.section{display:grid;gap:var(--space-8);padding-block:var(--space-12);border-top:1px solid var(--border)}
.section-head{display:grid;gap:var(--space-3);max-width:62ch}
.section-head h2,.cta-block h2{font:700 clamp(28px,6cqi,44px)/1.05 var(--font-display);letter-spacing:-.03em;text-wrap:balance}
.lead{font-size:18px;line-height:1.55;color:var(--muted-foreground);text-wrap:pretty}
.note{font:500 14px/1.5 var(--font-mono);color:var(--muted-foreground);max-width:70ch}

/* En-tête */
.header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);min-height:72px;position:relative}
.header .logo{display:flex;align-items:center;min-height:var(--hit-min)}
.header .logo img{height:28px;display:block}
.header-end{display:flex;align-items:center;gap:var(--space-2)}
.nav{display:none;position:absolute;top:100%;left:0;right:0;z-index:5;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:var(--space-2)}
.nav.open{display:block}
.nav ul{display:grid;gap:var(--space-1)}
.nav a{display:flex;align-items:center;min-height:var(--hit-min);padding:0 var(--space-3);border-radius:var(--radius-md);color:var(--foreground);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--muted)}
.nav a[aria-current=page]{background:var(--muted);color:var(--foreground)}
.menu-btn{display:inline-flex}
.header .btn-cta{display:none}

/* Hero */
.hero{display:grid;gap:var(--space-6);justify-items:start;padding-block:var(--space-12)}
.hero h1{font:700 clamp(40px,10cqi,84px)/1 var(--font-display);letter-spacing:-.035em;text-wrap:balance;max-width:14ch}
.hero .lead{max-width:52ch}
.btn-row{display:flex;flex-wrap:wrap;gap:var(--space-3)}
.facts{display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-8);font:500 13px/1.4 var(--font-mono);letter-spacing:.04em;color:var(--muted-foreground)}
.facts li{display:flex;align-items:center;gap:var(--space-2)}
.facts li::before{content:"";width:6px;height:6px;background:var(--brand);flex:none}

/* ==========================================================================
   4. COMPOSANTS — Button, Card, champs (mêmes classes que le système)
   ========================================================================== */
.ald-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--control-h);padding:0 18px;border-radius:var(--radius-md);border:1px solid transparent;font:500 15px/1 var(--font-sans);letter-spacing:-.005em;cursor:pointer;white-space:nowrap;text-decoration:none;user-select:none;transition:background-color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.ald-btn:active:not(:disabled){transform:translateY(1px)}
.ald-btn:disabled{opacity:var(--disabled-opacity);cursor:not-allowed}
.ald-btn--brand{background:var(--brand);color:var(--brand-foreground)}
.ald-btn--brand:hover:not(:disabled){background:color-mix(in oklab,var(--brand) 88%,var(--ink-950));color:var(--brand-foreground)}
.ald-btn--outline{background:transparent;color:var(--foreground);border-color:var(--input)}
.ald-btn--outline:hover:not(:disabled){background:var(--muted);color:var(--foreground);border-color:color-mix(in oklab,var(--input),var(--foreground) 20%)}
.ald-btn--sm{height:var(--control-h-sm);padding:0 12px;font-size:14px}
.ald-btn--lg{height:var(--control-h-lg);padding:0 24px;font-size:16px}
.ald-btn--block{width:100%}
.ald-btn--inv{background:transparent;color:inherit;border-color:currentColor}
.ald-btn--inv:hover:not(:disabled){background:color-mix(in oklab,currentColor 15%,transparent);color:inherit}
.ald-btn--sm{min-height:var(--hit-min)}
.ald-card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-6);min-width:0}
.ald-card--inverted{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
.ald-card__eyebrow{font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
.ald-card--inverted .ald-card__eyebrow,.ald-card--inverted .ald-card__desc{color:color-mix(in oklab,var(--primary-foreground) 78%,var(--primary))}
.ald-card__title{font:700 20px/1.25 var(--font-display);letter-spacing:-.01em}
.ald-card__desc{font-size:15px;line-height:1.5;color:var(--muted-foreground);text-wrap:pretty}
.grid{display:grid;gap:var(--space-4);grid-template-columns:minmax(0,1fr)}

/* Formules */
.plan{height:100%}
.plan .price{font:700 clamp(36px,9cqi,48px)/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.plan .rule{display:grid;gap:var(--space-2);padding-top:var(--space-4);border-top:1px solid currentColor}
.plan .badge{font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase}


/* Déroulé */
.step-n{font:500 12px/1 var(--font-mono);letter-spacing:.08em;color:var(--brand-text)}

/* Renvoi vers le simulateur */
.sim-link{background:var(--primary);color:var(--primary-foreground);border-radius:var(--radius-lg);padding:var(--space-8) var(--space-6);display:grid;gap:var(--space-4);justify-items:start}
.sim-link .eyebrow{color:inherit;opacity:.85}
.sim-link h2{font:700 clamp(28px,6cqi,44px)/1.05 var(--font-display);letter-spacing:-.03em;text-wrap:balance}
.sim-link p{font-size:18px;line-height:1.55;max-width:56ch;text-wrap:pretty;color:color-mix(in oklab,var(--primary-foreground) 85%,var(--primary))}

/* Exemples, en plus */
.list-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.list-box>li,.list-box>div{display:grid;gap:var(--space-3);padding:var(--space-5) var(--space-6);border-top:1px solid var(--border)}
.list-box>:first-child{border-top:0}
.ex b.t{font:600 17px/1.3 var(--font-sans)}
.ex .p{font:700 24px/1.2 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ex .d{font:500 13px/1.4 var(--font-mono);color:var(--muted-foreground)}
.extra{align-items:baseline}
.extra-txt{display:grid;gap:var(--space-1)}
.extra-txt b{font:600 17px/1.3 var(--font-sans)}
.extra-txt span{font-size:15px;line-height:1.5;color:var(--muted-foreground);text-wrap:pretty;max-width:60ch}
.extra-p{font:700 22px/1.2 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}

/* CTA final, pied */
.cta-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:var(--space-8) var(--space-6);display:grid;gap:var(--space-6);justify-items:start}
.footer{display:grid;gap:var(--space-8);padding-block:var(--space-12) var(--space-6);border-top:1px solid var(--border)}
.foot-cols{display:grid;gap:var(--space-8);grid-template-columns:minmax(0,1fr)}
.foot-brand{display:grid;gap:var(--space-4);align-content:start;max-width:34ch}
.foot-brand img{height:28px;display:block}
.foot-brand p{color:var(--muted-foreground);font-size:15px;line-height:1.5}
.foot-col h3{font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text);margin-bottom:var(--space-3)}
.foot-col ul{display:grid;gap:2px}
.foot-col a{display:inline-flex;align-items:center;min-height:var(--hit-min);color:var(--muted-foreground);text-decoration:none;font-size:15px}
.foot-col a:hover{color:var(--foreground)}
.foot-base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--space-2) var(--space-4);padding-top:var(--space-5);border-top:1px solid var(--border);font:500 12px/1.4 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}

/* Panneau de tweaks (dans la page) */
.tweaks{position:fixed;right:var(--space-4);bottom:var(--space-4);z-index:50;width:min(320px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg)}
.tweaks>button{width:100%;min-height:var(--hit-min);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-4);background:none;border:0;color:inherit;font:600 14px/1 var(--font-sans);cursor:pointer;border-radius:var(--radius-xl)}
.tweaks .body{display:none;gap:var(--space-4);padding:var(--space-2) var(--space-4) var(--space-4);border-top:1px solid var(--border)}
.tweaks.open .body{display:grid}
.tweaks .grp{display:grid;gap:var(--space-2);padding-top:var(--space-2)}
.tweaks .grp>span{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)}
.tweaks .opts{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.tweaks .opts button{min-height:var(--hit-min);padding:0 var(--space-3);border-radius:var(--radius-md);font:500 13px/1 var(--font-sans);cursor:pointer;border:1px solid var(--input);background:transparent;color:var(--foreground)}
.tweaks .opts button:hover{background:var(--muted)}
.tweaks .opts button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}

/* ==========================================================================
   5. ÉTATS — réduction des animations
   ========================================================================== */
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}html{scroll-behavior:auto}}

/* ==========================================================================
   6. RESPONSIVE — requêtes de conteneur (suivent la largeur du cadre)
   ========================================================================== */
@container page (min-width:640px){.foot-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container page (min-width:900px){.foot-cols{grid-template-columns:1.4fr 1fr 1fr 1fr}}
@container page (min-width:640px){
  .wrap{padding-inline:var(--space-8)}
  .grid.c2,.grid.plans,.grid.steps,.grid.rules{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ex{grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .extra{grid-template-columns:minmax(0,1fr) auto;gap:var(--space-8)}
  .extra-p{text-align:right}
}
@container page (min-width:900px){
  .wrap{padding-inline:var(--space-10)}
  .menu-btn{display:none}
  .nav{display:block;position:static;background:none;border:0;box-shadow:none;padding:0}
  .nav ul{display:flex;gap:var(--space-1)}
  .nav a{color:var(--muted-foreground);font-size:15px}
  .nav a:hover{background:none;color:var(--foreground)}
  .nav a[aria-current=page]{background:none;color:var(--foreground);box-shadow:inset 0 -2px 0 var(--brand);border-radius:0}
  .header .btn-cta{display:inline-flex}
  .grid.steps,.grid.rules{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.plans{grid-template-columns:repeat(3,minmax(0,1fr))}
  .section{padding-block:var(--space-20)}
  .hero{padding-block:var(--space-20)}
}
@container page (max-width:480px){
  .btn-row .ald-btn{width:100%}
}
</style>
</head>
<body>
<div class="frame" id="frame">
<div class="wrap">
<header class="header">
  <a class="logo" href="../home/Home.dc.html" aria-label="Aldaron"><img id="logo" src="../../assets/logo/aldaron-horizontal.svg" alt="Aldaron"></a>
  <nav class="nav" id="nav" aria-label="Principal"><ul id="navList"></ul></nav>
  <div class="header-end">
    <a class="ald-btn ald-btn--brand btn-cta" href="simulator.html" data-t="cta2"></a>
    <button type="button" class="ald-btn ald-btn--outline menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav" data-t="menu"></button>
  </div>
</header>
<main id="top">
  <section class="hero" aria-labelledby="h1">
    <h1 id="h1" data-t="h1"></h1>
    <p class="lead" data-t="sub"></p>
    <div class="btn-row"><a class="ald-btn ald-btn--brand ald-btn--lg" href="../contact/Contact.dc.html" data-t="cta"></a><a class="ald-btn ald-btn--outline ald-btn--lg" href="simulator.html" data-t="cta2"></a></div>
    <ul class="facts" id="facts"></ul>
  </section>

  <section class="section" id="tarifs" aria-labelledby="t-formules">
    <div class="section-head"><span class="eyebrow" data-t="plansEyebrow"></span><h2 id="t-formules" data-t="plansTitle"></h2></div>
    <ul class="grid plans" id="plans"></ul>
    <p class="note" data-t="beyond"></p>
  </section>

  <section class="section" id="deroule" aria-labelledby="t-deroule">
    <div class="section-head"><span class="eyebrow" data-t="flowEyebrow"></span><h2 id="t-deroule" data-t="flowTitle"></h2></div>
    <ol class="grid steps" id="steps"></ol>
  </section>

  <section class="section" id="simulateur" aria-labelledby="t-sim">
    <div class="sim-link"><span class="eyebrow" data-t="simEyebrow"></span><h2 id="t-sim" data-t="simTitle"></h2><p data-t="simSub"></p><a class="ald-btn ald-btn--brand ald-btn--lg" href="simulator.html" data-t="simGo"></a></div>
  </section>

  <section class="section" id="exemples" aria-labelledby="t-ex">
    <div class="section-head"><span class="eyebrow" data-t="exEyebrow"></span><h2 id="t-ex" data-t="exTitle"></h2></div>
    <ul class="list-box" id="examples"></ul>
  </section>

  <section class="section" id="options" aria-labelledby="t-extra">
    <div class="section-head"><span class="eyebrow" data-t="exEyebrow2"></span><h2 id="t-extra" data-t="extraTitle"></h2><p class="lead" data-t="extraSub"></p></div>
    <ul class="list-box" id="extras"></ul>
  </section>

  <section class="section" id="regles" aria-labelledby="t-rules">
    <div class="section-head"><span class="eyebrow" data-t="rulesEyebrow"></span><h2 id="t-rules" data-t="rulesTitle"></h2></div>
    <ul class="grid rules" id="rules"></ul>
  </section>

  <section class="section" id="contact" aria-labelledby="t-form">
    <div class="cta-block"><h2 id="t-form" data-t="formTitle"></h2><p class="lead" data-t="formSub"></p><a class="ald-btn ald-btn--brand ald-btn--lg" href="../contact/Contact.dc.html" data-t="cta"></a></div>
  </section>

</main>
<footer class="footer"><div class="foot-cols"><div class="foot-brand"><img id="logoF" src="../../assets/logo/aldaron-horizontal.svg" alt="Aldaron"><p data-t="footTag"></p></div><nav class="foot-col" aria-labelledby="fh-nav"><h3 id="fh-nav" data-t="footNav"></h3><ul id="footNavList"></ul></nav><nav class="foot-col" aria-labelledby="fh-legal"><h3 id="fh-legal" data-t="footLegal"></h3><ul><li><a href="../legal/Legal.dc.html" data-t="legal"></a></li><li><a href="../privacy/Privacy.dc.html" data-t="privacy"></a></li></ul></nav><div class="foot-col"><h3 data-t="footContact"></h3><ul><li><a href="mailto:contact@aldaron.eu">contact@aldaron.eu</a></li><li><a href="../contact/Contact.dc.html" data-t="footQuote"></a></li></ul></div></div><div class="foot-base"><span>© 2026 Aldaron</span><span data-t="footer"></span></div></footer>
</div>
</div>

<aside class="tweaks" id="tweaks" aria-label="Tweaks">
  <button type="button" id="twBtn" aria-expanded="false">Tweaks<span class="mono" id="twSign">+</span></button>
  <div class="body" id="twBody"></div>
</aside>

<script>
/* ==========================================================================
   Données : textes FR / EN
   ========================================================================== */
const I18N = {
  fr: {
    nav: ['Offre et prix', 'Simulateur', 'Réalisations', 'À propos', 'Contact'], menu: 'Menu',
    cta: 'Demander un devis', cta2: 'Estimer mon prix',
    h1: 'Le prix de votre produit, écran par écran.',
    sub: 'Le prix dépend du périmètre : supports, nombre d\'écrans, back-office et complexité métier. Il est fixé à la signature et ne change plus.',
    facts: ['À partir de 1 500 €', 'Prix fixe à la signature', '30 jours de correction de bugs'],
    plansEyebrow: 'Tarifs', plansTitle: 'Un prix par écran, selon le support',
    plans: [

/* ==========================================================================
   État
   ========================================================================== */
const S = { lang: 'fr', theme: 'light', bp: 'desktop', open: false };
const $ = id => document.getElementById(id);
const L = () => I18N[S.lang];
const eur = n => new Intl.NumberFormat(S.lang === 'en' ? 'en-IE' : 'fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);

/* ==========================================================================
   Rendu statique (par langue)
   ========================================================================== */
function renderStatic() {
  const t = L();
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
  const hrefs = ['#top', 'simulator.html', '../projects/Projects.dc.html', '../about/About.dc.html', '../contact/Contact.dc.html'];
  $('navList').innerHTML = t.nav.map((l, i) => `<li><a href="${hrefs[i]}"${i === 0 ? ' aria-current="page"' : ''}>${l}</a></li>`).join('');
  $('footNavList').innerHTML = t.nav.map((l, i) => `<li><a href="${hrefs[i]}">${l}</a></li>`).join('');
  $('facts').innerHTML = t.facts.map(f => `<li>${f}</li>`).join('');
  $('plans').innerHTML = t.plans.map((p, i) => {
    const inv = i === 1;
    return `<li><article class="ald-card plan${inv ? ' ald-card--inverted' : ''}"><span class="ald-card__eyebrow">${p[0]}</span><h3 class="ald-card__title">${p[1]}</h3><b class="price">${p[2]}</b><p class="ald-card__desc">${p[3]}</p></article></li>`;
  }).join('');
  $('steps').innerHTML = t.steps.map((s, i) => `<li><article class="ald-card" style="height:100%"><span class="step-n">0${i + 1}</span><h3 class="ald-card__title">${s[0]}</h3><p class="ald-card__desc">${s[1]}</p></article></li>`).join('');
  $('examples').innerHTML = t.examples.map(e => `<li class="ex"><div style="display:grid;gap:4px"><b class="t">${e[0]}</b><span class="d">${e[1]}</span></div><span class="p">${eur(e[2])}</span></li>`).join('');
  $('extras').innerHTML = t.extras.map(e => `<li class="extra"><div class="extra-txt"><b>${e[0]}</b><span>${e[2]}</span></div><span class="extra-p">${e[1]}</span></li>`).join('');
  $('rules').innerHTML = t.rules.map(r => `<li><article class="ald-card" style="height:100%"><h3 class="ald-card__title">${r[0]}</h3><p class="ald-card__desc">${r[1]}</p></article></li>`).join('');
  renderTweaks();
}

/* ==========================================================================
   Panneau de tweaks
   ========================================================================== */
function renderTweaks() {
  const t = L().tw;
  const g = (title, key, opts, cur) => `<div class="grp"><span>${title}</span><div class="opts" role="group" aria-label="${title}">${opts.map(o => `<button type="button" data-k="${key}" data-v="${o[0]}" aria-pressed="${String(String(cur) === String(o[0]))}">${o[1]}</button>`).join('')}</div></div>`;
  $('twBody').innerHTML =
    g(t.theme, 'theme', [['light', t.light], ['dark', t.dark]], S.theme) +
    g(t.lang, 'lang', [['fr', 'FR'], ['en', 'EN'], ['mg', 'MG']], S.lang) +
    g(t.bp, 'bp', [['mobile', t.mobile], ['tablet', t.tablet], ['desktop', t.desktop], ['large', t.large]], S.bp);
}
function applyEnv() {
  document.documentElement.classList.toggle('dark', S.theme === 'dark');
  document.body.dataset.bp = S.bp;
  $('logo').src = $('logoF').src = '../../assets/logo/aldaron-horizontal' + (S.theme === 'dark' ? '-dark' : '') + '.svg';
}

/* ==========================================================================
   Événements
   ========================================================================== */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.k) {
    const k = b.dataset.k, v = b.dataset.v;
    S[k] = v; applyEnv(); if (k === 'lang') renderStatic(); else renderTweaks();
  }
  else if (b.id === 'twBtn') { S.open = !S.open; $('tweaks').classList.toggle('open', S.open); b.setAttribute('aria-expanded', S.open); $('twSign').textContent = S.open ? '−' : '+'; }
  else if (b.id === 'menuBtn') { const o = $('nav').classList.toggle('open'); b.setAttribute('aria-expanded', o); }
});
$('nav').addEventListener('click', e => { if (e.target.closest('a')) { $('nav').classList.remove('open'); $('menuBtn').setAttribute('aria-expanded', 'false'); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('nav').classList.remove('open'); } });

applyEnv(); renderStatic();
</script>

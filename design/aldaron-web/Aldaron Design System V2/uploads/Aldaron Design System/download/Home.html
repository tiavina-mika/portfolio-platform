/* ==========================================================
   2. Variables / tokens
   ========================================================== */
:root {
  --ink-900:#17181A; --ink-950:#0E0F0D;
  --stone-100:#EEEAE3; --stone-200:#E3DED5; --stone-300:#CFC8BD; --stone-400:#A19B92; --stone-600:#5E5A54;
  --paper-50:#F6F3EE; --paper-0:#FFFFFF;
  --signal-100:#FBE3D6; --signal-400:#F26A33; --signal-500:#E2531B; --signal-700:#B4400F; --signal-50:#FDF1EA;

  --background:var(--paper-50); --foreground:var(--ink-900);
  --card:var(--paper-0); --card-foreground:var(--ink-900);
  --popover:var(--paper-0); --popover-foreground:var(--ink-900);
  --primary:var(--ink-900); --primary-foreground:var(--paper-50);
  --secondary:var(--stone-100); --secondary-foreground:var(--ink-900);
  --muted:var(--stone-100); --muted-foreground:var(--stone-600);
  --brand:var(--signal-500); --brand-foreground:var(--ink-900); --brand-text:var(--signal-700);
  --border:var(--stone-200); --input:var(--stone-300); --ring:var(--signal-500);

  --font-sans:'Familjen Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-display:'Familjen Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --radius-md:6px; --radius-lg:8px; --radius-xl:12px;
  --shadow-sm:0 1px 2px rgba(23,24,26,.06),0 1px 1px rgba(23,24,26,.04);
  --shadow-lg:0 16px 40px -8px rgba(23,24,26,.16),0 4px 12px rgba(23,24,26,.06);
  --ring-width:2px; --ring-offset:2px;
  --focus-ring:0 0 0 var(--ring-offset) var(--background),0 0 0 calc(var(--ring-offset) + var(--ring-width)) var(--ring);
  --control-h:44px; --control-h-sm:36px; --control-h-lg:52px;
  --disabled-opacity:.45;
  --ease-out:cubic-bezier(.2,.7,.2,1); --dur-fast:120ms;
}
.dark {
  --background:#121311; --foreground:var(--stone-100);
  --card:#1A1C19; --card-foreground:var(--stone-100);
  --popover:#1F211D; --popover-foreground:var(--stone-100);
  --primary:var(--stone-100); --primary-foreground:var(--ink-900);
  --secondary:#272924; --secondary-foreground:var(--stone-100);
  --muted:#232521; --muted-foreground:var(--stone-400);
  --brand:var(--signal-400); --brand-foreground:var(--ink-950); --brand-text:var(--signal-400);
  --border:#2C2D29; --input:#3A3B36; --ring:var(--signal-400);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 16px 40px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
}

/* ==========================================================
   3. Base
   ========================================================== */
*, *::before, *::after { box-sizing:border-box; }
body { margin:0; background:var(--background); color:var(--foreground); font-family:var(--font-sans); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; }
a { color:var(--brand-text); }
a:hover { color:var(--foreground); }
button { font-family:inherit; }
:focus-visible { outline:none; box-shadow:var(--focus-ring); border-radius:4px; }
::selection { background:var(--signal-100); color:var(--ink-900); }
.page { min-height:100vh; padding-bottom:96px; background:var(--background); color:var(--foreground); }
.frame { width:var(--frame-w,1200px); max-width:100%; margin:0 auto; padding:0 var(--gutter,32px); }

/* ==========================================================
   4. Composant Button
   ========================================================== */
.ald-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:var(--control-h); padding:0 18px; border-radius:var(--radius-md); border:1px solid transparent; font:500 15px/1 var(--font-sans); letter-spacing:-0.005em; cursor:pointer; white-space:nowrap; text-decoration:none; user-select:none; transition:background-color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out); }
.ald-btn:focus-visible { outline:none; box-shadow:var(--focus-ring); border-radius:var(--radius-md); }
.ald-btn:active { transform:translateY(1px); }
.ald-btn--brand { background:var(--brand); color:var(--brand-foreground); }
.ald-btn--brand:hover { background:color-mix(in oklab,var(--brand) 88%,#000); color:var(--brand-foreground); }
.ald-btn--outline { background:transparent; color:var(--foreground); border-color:var(--input); }
.ald-btn--outline:hover { background:var(--muted); border-color:color-mix(in oklab,var(--input),var(--foreground) 20%); color:var(--foreground); }
.ald-btn--sm { height:var(--control-h-sm); padding:0 12px; font-size:14px; gap:6px; }
.ald-btn--lg { height:var(--control-h-lg); padding:0 24px; font-size:16px; }

/* ==========================================================
   5. Composant Card
   ========================================================== */
.ald-card { background:var(--card); color:var(--card-foreground); border:1px solid var(--border); border-radius:var(--radius-lg); display:flex; flex-direction:column; min-width:0; height:100%; --card-pad:24px; }
.ald-card--muted { background:var(--muted); border-color:transparent; }
.ald-card--inverted { background:var(--primary); color:var(--primary-foreground); border-color:transparent; }
.ald-card--inverted .ald-card__desc { color:color-mix(in oklab,var(--primary-foreground) 72%,var(--primary)); }
.ald-card__head { padding:var(--card-pad) var(--card-pad) 0; }
.ald-card__head--last { padding-bottom:var(--card-pad); }
.ald-card__eyebrow { font:500 12px/1 var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted-foreground); margin-bottom:10px; }
.ald-card--inverted .ald-card__eyebrow { color:inherit; opacity:.8; }
.ald-card__title { margin:0; font:700 20px/1.25 var(--font-display); letter-spacing:-0.01em; }
.ald-card__desc { margin:6px 0 0; font-size:14px; line-height:1.5; color:var(--muted-foreground); }
.ald-card__body { padding:var(--card-pad); flex:1; }

/* ==========================================================
   6. Page Home
   ========================================================== */
.header { display:flex; align-items:center; justify-content:space-between; gap:16px; height:72px; border-bottom:1px solid var(--border); }
.header__logo { display:flex; align-items:center; }
.header__logo img { height:28px; display:block; }
.nav { display:flex; gap:28px; }
.nav a { color:var(--muted-foreground); text-decoration:none; font:500 15px/1 var(--font-sans); }
.nav a:hover { color:var(--foreground); }
.label { font:500 12px/1 var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--brand-text); }
.hero { padding:var(--hero-pad,96px) 0 var(--sec-pad,96px); display:grid; gap:28px; justify-items:start; }
.hero h1 { margin:0; font:700 var(--h1,68px)/1.02 var(--font-display); letter-spacing:-0.035em; text-wrap:balance; max-width:16ch; }
.hero__lead { margin:0; font-size:var(--lead,20px); line-height:1.55; color:var(--muted-foreground); max-width:56ch; text-wrap:pretty; }
.actions { display:flex; gap:12px; flex-wrap:wrap; }
.facts { list-style:none; margin:16px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:12px 32px; font:500 13px/1 var(--font-mono); letter-spacing:.04em; color:var(--muted-foreground); }
.facts li { display:flex; align-items:center; gap:8px; }
.facts li::before { content:""; width:6px; height:6px; background:var(--brand); display:block; }
.section { padding:var(--sec-pad,96px) 0; border-top:1px solid var(--border); display:grid; gap:40px; }
.section__head { display:grid; gap:12px; }
.section h2 { margin:0; font:700 var(--h2,40px)/1.05 var(--font-display); letter-spacing:-0.03em; text-wrap:balance; max-width:20ch; }
.section__sub { margin:0; font-size:18px; line-height:1.55; color:var(--muted-foreground); max-width:56ch; }
.grid-blocks { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
.grid-offers { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; align-items:stretch; }
.offer { display:grid; gap:20px; }
.offer__from { display:block; margin-bottom:6px; font:500 11px/1 var(--font-mono); letter-spacing:.08em; text-transform:uppercase; opacity:.8; }
.offer__price { font:700 40px/1 var(--font-display); letter-spacing:-0.03em; }
.offer ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; font-size:15px; line-height:1.4; }
.offer li { display:flex; gap:10px; }
.offer li span:first-child { font:500 14px/1.4 var(--font-mono); opacity:.8; }
.cta { padding:var(--sec-pad,96px) 0 0; border-top:1px solid var(--border); }
.cta__box { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-xl); padding:var(--cta-pad,40px); display:flex; align-items:center; justify-content:space-between; gap:32px; flex-wrap:wrap; }
.cta__text { display:grid; gap:12px; max-width:52ch; }
.cta h2 { margin:0; font:700 var(--h2,40px)/1.05 var(--font-display); letter-spacing:-0.03em; text-wrap:balance; }
.footer { margin-top:var(--sec-pad,96px); padding-top:24px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; font:500 12px/1 var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted-foreground); }

/* ==========================================================
   7. Panneau de tweaks
   ========================================================== */
.tweaks { position:fixed; right:16px; bottom:16px; z-index:50; width:min(320px,calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; background:var(--popover); color:var(--popover-foreground); border:1px solid var(--border); border-radius:var(--radius-xl); box-shadow:var(--shadow-lg); }
.tweaks__toggle { width:100%; min-height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; background:none; border:0; color:inherit; font:600 14px/1 var(--font-sans); cursor:pointer; border-radius:var(--radius-xl); }
.tweaks__toggle:hover { background:var(--muted); }
.tweaks__toggle span { font:500 12px var(--font-mono); color:var(--muted-foreground); }
.tweaks__body { padding:4px 16px 16px; display:grid; gap:14px; border-top:1px solid var(--border); }
.tweaks__group { display:grid; gap:6px; padding-top:10px; }
.tweaks__title { font:500 11px/1 var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--brand-text); }
.tweaks__opts { display:flex; gap:4px; flex-wrap:wrap; }
.tweaks__opt { min-height:36px; padding:0 12px; border-radius:var(--radius-md); font:500 13px/1 var(--font-sans); cursor:pointer; border:1px solid var(--input); background:transparent; color:var(--foreground); }
.tweaks__opt:hover { background:var(--muted); }
.tweaks__opt[aria-pressed="true"] { background:var(--primary); color:var(--primary-foreground); border-color:transparent; }
.tweaks__opt[aria-pressed="true"]:hover { filter:brightness(.96); }

/* ==========================================================
   8. Responsive (largeur pilotée par le tweak Largeur)
   ========================================================== */
@media (max-width:640px) { .nav { display:none; } }
</style>

    '<section class="hero"><span class="label">' + esc(T.heroEyebrow) + '</span><h1>' + esc(T.h1) + '</h1><p class="hero__lead">' + esc(T.sub) + '</p><div class="actions">' + btn('brand', 'lg', '#contact', T.cta) + btn('outline', 'lg', '#socle', T.cta2) + '</div><ul class="facts">' + T.facts.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></section>' +
    '<section class="section" id="socle"><div class="section__head"><span class="label">' + esc(T.socleLabel) + '</span><h2>' + esc(T.socleTitle) + '</h2><p class="section__sub">' + esc(T.socleSub) + '</p></div><div class="grid-blocks">' + T.blocks.map(function (b) { return card('default', T.socleLabel, b[0], b[1]); }).join('') + '</div></section>' +
    '<section class="section" id="offre"><div class="section__head"><span class="label">' + esc(T.offreLabel) + '</span><h2>' + esc(T.offreTitle) + '</h2><p class="section__sub">' + esc(T.offreSub) + '</p></div><div class="grid-offers">' + offers + '</div><div>' + btn('outline', 'lg', 'Pricing.html', T.cta3) + '</div></section>' +
    '<section class="cta" id="contact"><div class="cta__box"><div class="cta__text"><h2>' + esc(T.ctaTitle) + '</h2><p class="section__sub">' + esc(T.ctaSub) + '</p></div>' + btn('brand', 'lg', 'mailto:contact@aldaron.eu', T.cta) + '</div></section></main>' +
    '<footer class="footer"><span>© 2026 Aldaron</span><span>' + esc(T.footer) + '</span></footer>';
}
function group(title, key, list, T) {
  return { title: title, key: key, opts: list.map(function (p) { return { v: p[0], label: T[p[1]] || p[1] }; }) };
}
function panelHtml(T) {
  var L = { fr: ['Carte « sur mesure » mise en avant', 'Carte mobile'], en: ['Highlighted custom card', 'Mobile card'], mg: ['Karatra manokana asongadina', 'Karatra finday'] }[state.lang];
  var yn = function (k, t) { return group(t, k, [[true, 'on'], [false, 'off']], T); };
  var groups = [yn('product', L[0]), yn('mobile', L[1]), group(T.theme, 'theme', [['light', 'light'], ['dark', 'dark']], T), group(T.lang, 'lang', [['fr', 'FR'], ['en', 'EN'], ['mg', 'MG']], T), group(T.bp, 'bp', [['mobile', 'mobile'], ['tablet', 'tablet'], ['desktop', 'desktop'], ['large', 'large']], T)];
  var h = '<button type="button" class="tweaks__toggle" data-toggle aria-expanded="' + state.open + '">Tweaks<span>' + (state.open ? '−' : '+') + '</span></button>';
  if (state.open) {
    h += '<div class="tweaks__body">' + groups.map(function (g) {
      return '<div class="tweaks__group"><span class="tweaks__title">' + esc(g.title) + '</span><div class="tweaks__opts">' + g.opts.map(function (o) {
        return '<button type="button" class="tweaks__opt" data-key="' + g.key + '" data-val="' + o.v + '" aria-pressed="' + (state[g.key] === o.v) + '">' + esc(o.label) + '</button>';
      }).join('') + '</div></div>';
    }).join('') + '</div>';
  }
  return h;
}
function render() {
  var T = Object.assign({}, CT[state.lang], PT[state.lang]);
  var m = state.bp === 'mobile', t = state.bp === 'tablet';
  var root = document.getElementById('root'), frame = document.getElementById('frame'), panel = document.getElementById('tweaks');
  var focus = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset : {};
  root.className = 'page' + (state.theme === 'dark' ? ' dark' : '');
  panel.className = 'tweaks' + (state.theme === 'dark' ? ' dark' : '');
  document.documentElement.lang = state.lang;
  var s = frame.style;
  s.setProperty('--frame-w', WIDTHS[state.bp] + 'px');
  s.setProperty('--gutter', (m ? 20 : 32) + 'px');
  s.setProperty('--hero-pad', (m ? 48 : 96) + 'px');
  s.setProperty('--sec-pad', (m ? 56 : 96) + 'px');
  s.setProperty('--cta-pad', (m ? 24 : 40) + 'px');
  s.setProperty('--h1', (m ? 38 : t ? 52 : 68) + 'px');
  s.setProperty('--h2', (m ? 30 : 40) + 'px');
  s.setProperty('--lead', (m ? 18 : 20) + 'px');
  frame.innerHTML = pageHtml(T);
  panel.innerHTML = panelHtml(T);
  if (focus.key) { var f = panel.querySelector('[data-key="' + focus.key + '"][data-val="' + focus.val + '"]'); if (f) f.focus(); }
  else if ('toggle' in focus) { var b = panel.querySelector('[data-toggle]'); if (b) b.focus(); }
}
document.getElementById('tweaks').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if ('toggle' in b.dataset) state.open = !state.open;
  else { var v = b.dataset.val; state[b.dataset.key] = v === 'true' ? true : v === 'false' ? false : v; }
  render();
});
render();

</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aldaron · Simulateur</title>
<style>
/* ==========================================================================
   1. VARIABLES — jetons Aldaron (clair :root, sombre .dark)
   ========================================================================== */
@font-face{font-family:'Familjen Grotesk';font-weight:400;font-display:swap;src:url('../assets/fonts/familjen-grotesk-400.woff2') format('woff2')}
@font-face{font-family:'Familjen Grotesk';font-weight:500;font-display:swap;src:url('../assets/fonts/familjen-grotesk-500.woff2') format('woff2')}
@font-face{font-family:'Familjen Grotesk';font-weight:600;font-display:swap;src:url('../assets/fonts/familjen-grotesk-600.woff2') format('woff2')}
@font-face{font-family:'Familjen Grotesk';font-weight:700;font-display:swap;src:url('../assets/fonts/familjen-grotesk-700.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url('../assets/fonts/ibm-plex-mono-400.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url('../assets/fonts/ibm-plex-mono-500.woff2') format('woff2')}
:root{
  --ink-950:#0E0F0D;--ink-900:#17181A;
  --stone-600:#5E5A54;--stone-400:#A19B92;--stone-300:#CFC8BD;--stone-200:#E3DED5;--stone-100:#EEEAE3;
  --paper-50:#F6F3EE;--paper-0:#FFFFFF;
  --signal-700:#B4400F;--signal-500:#E2531B;--signal-400:#F26A33;--signal-50:#FDF1EA;
  --green-700:#1E6B47;--green-400:#5BC58B;--red-700:#B42318;--red-400:#F26B5E;
  --background:var(--paper-50);--foreground:var(--ink-900);
  --card:var(--paper-0);--card-foreground:var(--ink-900);
  --popover:var(--paper-0);--popover-foreground:var(--ink-900);
  --primary:var(--ink-900);--primary-foreground:var(--paper-50);
  --muted:var(--stone-100);--muted-foreground:var(--stone-600);
  --brand:var(--signal-500);--brand-foreground:var(--ink-900);--brand-text:var(--signal-700);
  --destructive:var(--red-700);--success:var(--green-700);
  --border:var(--stone-200);--input:var(--stone-300);--ring:var(--signal-500);
  --font-sans:'Familjen Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;
  --radius-md:6px;--radius-lg:8px;
  --shadow-lg:0 16px 40px -8px rgba(23,24,26,.16),0 4px 12px rgba(23,24,26,.06);
  --focus-ring:0 0 0 2px var(--background),0 0 0 4px var(--ring);
  --hit-min:44px;--control-h:44px;--control-h-lg:52px;--disabled-opacity:.45;
  --ease-out:cubic-bezier(.2,.7,.2,1);--dur-fast:120ms;
}
.dark{
  --background:#121311;--foreground:var(--stone-100);
  --card:#1A1C19;--card-foreground:var(--stone-100);
  --popover:#1F211D;--popover-foreground:var(--stone-100);
  --primary:var(--stone-100);--primary-foreground:var(--ink-900);
  --muted:#232521;--muted-foreground:var(--stone-400);
  --brand:var(--signal-400);--brand-foreground:var(--ink-950);--brand-text:var(--signal-400);
  --destructive:var(--red-400);--success:var(--green-400);
  --border:#2C2D29;--input:#3A3B36;--ring:var(--signal-400);
  --shadow-lg:0 16px 40px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--muted);color:var(--foreground);font:400 16px/1.55 var(--font-sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,dl,dd,fieldset{margin:0;padding:0}
ul{list-style:none}
fieldset{border:0;min-width:0}
a{color:var(--brand-text)}a:hover{color:var(--foreground)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)}

/* ==========================================================================
   3. PAGE — cadre (point de rupture simulé) et grille
   ========================================================================== */
.frame{container:page / inline-size;background:var(--background);margin-inline:auto;width:100%;max-width:1200px;min-height:100vh;border-inline:1px solid var(--border)}
[data-bp=mobile] .frame{max-width:390px}
[data-bp=tablet] .frame{max-width:768px}
[data-bp=desktop] .frame{max-width:1200px}
[data-bp=large] .frame{max-width:1600px}
.wrap{padding:var(--space-8) var(--space-5) var(--space-12);display:grid;gap:var(--space-8)}
.intro{display:grid;gap:var(--space-3);max-width:62ch}
.intro h1{font:700 clamp(30px,7cqi,52px)/1.05 var(--font-sans);letter-spacing:-.03em;text-wrap:balance}
.back{display:inline-flex;align-items:center;min-height:var(--hit-min);justify-self:start;font:500 15px/1 var(--font-sans);color:var(--muted-foreground);text-decoration:none}
.back:hover{color:var(--foreground)}
.lead{font-size:18px;color:var(--muted-foreground);text-wrap:pretty}
.layout{display:grid;gap:var(--space-8);grid-template-columns:minmax(0,1fr);align-items:start}
.form{display:grid;gap:var(--space-5)}

/* ==========================================================================
   4. COMPOSANTS
   ========================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--control-h);padding:0 18px;border-radius:var(--radius-md);border:1px solid transparent;font:500 15px/1.2 var(--font-sans);cursor:pointer;text-decoration:none;user-select:none;text-align:center;transition:background-color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.btn:active{transform:translateY(1px)}
.btn--brand{background:var(--brand);color:var(--brand-foreground)}
.btn--brand:hover{background:color-mix(in oklab,var(--brand) 88%,var(--ink-950))}
.btn--outline{background:transparent;border-color:var(--input)}
.btn--outline:hover{background:var(--muted);border-color:color-mix(in oklab,var(--input),var(--foreground) 20%)}
.btn--block{width:100%}
.btn--lg{min-height:var(--control-h-lg)}

.chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.chips-label{font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
.chip{min-height:var(--hit-min);padding:0 14px;border-radius:var(--radius-md);border:1px solid var(--input);background:var(--card);cursor:pointer;font-weight:500;font-size:14px;transition:background-color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.chip:hover{background:var(--muted)}
.chip[aria-pressed=true]{border-color:var(--brand);background:var(--muted)}

.step{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6);display:grid;gap:var(--space-4)}
.step legend{float:left;width:100%;padding:0;display:flex;align-items:center;gap:var(--space-3);font:700 20px/1.25 var(--font-sans);letter-spacing:-.01em;margin-bottom:var(--space-4)}
.step legend+*{clear:both}
.form{counter-reset:st}.step[hidden]{display:none}.step:not([hidden]){counter-increment:st}.num::before{content:counter(st)}
.num{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);font:500 13px/1 var(--font-mono)}
.help{font-size:15px;color:var(--muted-foreground);text-wrap:pretty}
.opts{display:grid;gap:var(--space-2);grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.opt{position:relative;display:flex;align-items:flex-start;gap:var(--space-3);min-height:var(--hit-min);padding:var(--space-3) var(--space-4);border:1px solid var(--input);border-radius:var(--radius-md);background:var(--background);cursor:pointer;transition:background-color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.opt:hover{background:var(--muted)}
.opt input{flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--brand);cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.opt:has(input:focus-visible){box-shadow:var(--focus-ring)}
.opt b{display:block;font-weight:600;line-height:1.3}
.opt small{display:block;font-size:14px;color:var(--muted-foreground);line-height:1.4;margin-top:2px}
.sub{display:grid;gap:var(--space-3);padding-top:var(--space-4);border-top:1px solid var(--border)}
.sub legend{font:600 15px/1.3 var(--font-sans);margin-bottom:var(--space-3)}

.size-row{display:grid;gap:var(--space-3)}
.sup-ex{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:var(--space-1) var(--space-4);margin:0;font-size:14px;line-height:1.4;color:var(--muted-foreground)}
.sup-ex dt{font-weight:600;color:var(--foreground)}
.sup-ex[hidden],.sup-ex [hidden]{display:none}
.design-rate{padding:var(--space-4);border:1px solid var(--brand);border-radius:var(--radius-md);background:color-mix(in oklab,var(--brand) 10%,var(--card));font-size:15px;color:var(--foreground);display:grid;gap:var(--space-1)}
.dr-title{font:600 15px/1.3 var(--font-sans)}
.design-rate[hidden]{display:none}
.size-row label{font:600 15px/1.3 var(--font-sans)}
.size-ctl{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:var(--space-4);align-items:center}
input[type=range]{width:100%;height:var(--hit-min);accent-color:var(--brand);cursor:pointer;margin:0}
.num-in{height:var(--control-h);padding:0 12px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--background);font:500 16px/1 var(--font-mono);width:100%}
.sub[hidden],.fx[hidden],.size-row[hidden]{display:none}.fx{display:grid;gap:var(--space-3)}.pay-n{max-width:140px;cursor:pointer}

.field{display:grid;gap:var(--space-2)}
.field label{font:600 15px/1.3 var(--font-sans)}
.field input,.field textarea{width:100%;min-height:var(--control-h);padding:10px 12px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--background)}
.field textarea{min-height:200px;resize:vertical;line-height:1.5}
.field .err{display:none;font-size:14px;color:var(--destructive)}
.field.invalid .err{display:block}
.field.invalid input{border-color:var(--destructive)}

/* Résultat */
.result{display:grid;gap:var(--space-5);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6)}
.result h2{font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)}
.price{font:700 clamp(32px,8cqi,44px)/1.05 var(--font-sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-wrap:balance}
.precision{font:500 14px/1.4 var(--font-mono);color:var(--muted-foreground);margin-top:var(--space-2)}
.lines{display:grid;gap:var(--space-2)}.lines li{display:flex;justify-content:space-between;gap:var(--space-3);padding-top:var(--space-2);border-top:1px solid var(--border);font-size:15px}
.disclaimer{font-size:14px;color:var(--muted-foreground)}
.block{display:grid;gap:var(--space-2);padding-top:var(--space-4);border-top:1px solid var(--border)}
.block h3{font:600 15px/1.3 var(--font-sans)}
.ticks li{position:relative;padding-left:22px;font-size:15px}
.ticks li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;background:var(--success)}
.ticks.no li::before{background:var(--muted-foreground)}
.block p{font-size:15px;color:var(--muted-foreground);text-wrap:pretty}
.actions{display:grid;gap:var(--space-2)}

/* Barre basse (étroit) */
.bar{display:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--primary);color:var(--primary-foreground);padding:10px 16px;border-radius:var(--radius-md);font-size:14px;opacity:0;pointer-events:none;transition:opacity var(--dur-fast) var(--ease-out);z-index:30}
.toast.show{opacity:1}

/* Dialogue de devis */
dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:var(--space-6);border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--popover);color:var(--popover-foreground);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:color-mix(in oklab,var(--ink-950) 60%,transparent)}
dialog form{display:grid;gap:var(--space-4)}
dialog h2{font:700 24px/1.2 var(--font-sans);letter-spacing:-.02em}
.dlg-actions{display:flex;flex-wrap:wrap;gap:var(--space-2);justify-content:flex-end}
.thanks{display:none;color:var(--success);font-weight:600}
dialog.sent .thanks{display:block}

/* Réglages */
.gear{position:fixed;top:12px;right:12px;z-index:40;box-shadow:var(--shadow-lg);background:var(--card)}
.panel{position:fixed;top:64px;right:12px;z-index:40;width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:var(--space-4);display:grid;gap:var(--space-4)}
.panel[hidden]{display:none}
.panel h2{font:600 15px/1.3 var(--font-sans)}
.panel fieldset{display:grid;gap:var(--space-2)}
.panel legend{font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:var(--space-2)}
.seg{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.seg label{display:inline-flex}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;min-height:var(--hit-min);padding:0 12px;border:1px solid var(--input);border-radius:var(--radius-md);cursor:pointer;font-size:14px;font-weight:500}
.seg input:checked+span{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.seg input:focus-visible+span{box-shadow:var(--focus-ring)}
.pgrid{display:grid;grid-template-columns:1fr 96px;gap:var(--space-2) var(--space-3);align-items:center}
.pgrid label{font:400 13px/1.2 var(--font-mono)}
.pgrid input{height:var(--hit-min);padding:0 8px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--background);font:500 14px var(--font-mono);width:100%}
.calib{width:100%;border-collapse:collapse;font:400 13px/1.4 var(--font-mono)}
.calib th,.calib td{text-align:right;padding:6px 4px;border-top:1px solid var(--border)}
.calib th:first-child,.calib td:first-child{text-align:left;font-family:var(--font-sans)}
.calib .ok{color:var(--success)}.calib .ko{color:var(--destructive)}

/* ==========================================================================
   5. ÉTATS — survol, focus et actifs sont déclarés avec chaque composant
   ========================================================================== */
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ==========================================================================
   6. RESPONSIVE — selon la largeur du cadre
   ========================================================================== */
@container page (max-width:879px){
  .bar{display:flex;position:sticky;bottom:0;z-index:20;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-5);background:var(--popover);border-top:1px solid var(--border);box-shadow:var(--shadow-lg)}
  .bar .price{font-size:22px}
  .bar .btn{flex:none;max-width:48%}
}
@container page (max-width:479px){.size-ctl{grid-template-columns:minmax(0,1fr) 92px}.step{padding:var(--space-4)}.result{padding:var(--space-4)}}
@container page (min-width:880px){
  .wrap{padding-inline:var(--space-10)}
  .layout{grid-template-columns:minmax(0,1fr) 380px;gap:var(--space-10)}
  .result{position:sticky;top:var(--space-5)}
}
</style>
</head>
<body data-bp="desktop">
<button class="btn btn--outline gear" id="gear" aria-expanded="false" aria-controls="panel"></button>
<aside class="panel" id="panel" hidden></aside>
<div class="frame">
  <div class="wrap">
    <header class="intro"><a class="back" id="t-back" href="Pricing.html"></a><p class="eyebrow" id="t-eyebrow"></p><h1 id="t-title"></h1><p class="lead" id="t-lead"></p></header>
    <div class="chips-wrap" style="display:grid;gap:12px"><p class="chips-label" id="t-ex"></p><div class="chips" id="examples"></div></div>
    <div class="layout">
      <form class="form" id="form" novalidate onsubmit="return false"></form>
      <aside class="result" id="result" aria-labelledby="t-res-h"></aside>
    </div>
  </div>
  <div class="bar" id="bar"></div>
</div>
<dialog id="dlg" aria-labelledby="d-title"><form id="qform" novalidate></form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ==========================================================================
   A. PRICING — toutes les valeurs de calcul, en euros, modifiables en direct
   ========================================================================== */
const PRICING = {
  floor: 2500,
  floorWeb: 1500,
  designIdea: 8,
  designSpec: 6,
  base: 0,
  screen: 25,
  screenApp: 18,
  screenRich: 30,
  boFactor: 1.5,
  complexity: { standard: 1, some: 1.5, heavy: 2.5 },
  share: { few: 0.25, half: 0.5, most: 1 },
  ceiling: 15000,
  ceilingRich: 10000,
  payFirst: 500,
  payExtra: 22,
  chat: 500
};
const DEFAULTS = JSON.parse(JSON.stringify(PRICING));

/* Exemples en un clic : état + prix de référence pour le calibrage */
const EXAMPLES = [
  { id: 'saas',   ref: 1820, s: { prec: 'idea',   web: 25, mobile: 0, bo: 15, cx: 'standard' } },
  { id: 'mobile', ref: 6200, s: { prec: 'spec',   web: 0, mobile: 200, bo: 0, cx: 'standard' } },
  { id: 'back',   ref: 10500, s: { prec: 'mockup', web: 0, mobile: 180, bo: 40, cx: 'heavy' } },
  { id: 'both',   ref: 9870, s: { prec: 'spec',   web: 140, mobile: 140, bo: 15, cx: 'standard', pay: { mobile: true, app: false }, payN: { mobile: 1, app: 1 } } }
];

const floorFor = s => s.mobile > 0 ? PRICING.floor : PRICING.floorWeb;
function compute(s) {
  const P = PRICING, k = 1 + (P.share[s.cxShare] ?? P.share.half) * (P.complexity[s.cx] - 1), rich = s.rich === 'rich', appRate = rich ? (s.mobile > 0 ? (P.screen + P.screenRich) / 2 : P.screenRich) : (s.mobile > 0 ? (P.screen + P.screenApp) / 2 : P.screenApp);
  const boOnly = !!s.sup && s.sup.bo && !s.sup.web && !s.sup.app && !s.sup.mobile;
  const boN = boOnly ? Math.max(15, s.bo) : s.bo;
  const r100 = n => Math.round(n / 100) * 100;
  const parts = { web: r100(s.web * P.screen * k), app: r100((s.app || 0) * appRate * k), mobile: r100(s.mobile * P.screen * k), bo: r100(boN * P.screen * P.boFactor * k) };
  const total = parts.web + parts.app + parts.mobile + parts.bo;
  const pp = k => s.pay && s.pay[k] ? P.payFirst + P.payExtra * (Math.min(5, Math.max(1, Math.round(s.payN[k]) || 1)) - 1) : 0;
  parts.payMobile = pp('mobile'); parts.payApp = pp('app');
  parts.chat = s.chat ? P.chat : 0;
  const dRate = { idea: P.designIdea, spec: P.designSpec, mockup: 0 }[s.prec || 'idea'], dScreens = s.web + boN + Math.max(s.app || 0, s.mobile) + 0.5 * Math.min(s.app || 0, s.mobile);
  parts.design = r100(dScreens * dRate);
  const pay = parts.payMobile + parts.payApp + parts.chat + parts.design;
  const base = Math.max(boOnly ? 0 : floorFor(s), total);
  parts.floorAdj = base - total;
  const price = base + pay;
  return { parts, total, price, over: total > (rich ? P.ceilingRich : P.ceiling), atFloor: !boOnly && base <= floorFor(s) && !pay, boOnly };
}

/* ==========================================================================
   B. TEXTES — fr / en
   ========================================================================== */
const I18N = {
  fr: {
    back: '← Offre et prix', eyebrow: 'Simulateur de prix', title: 'Estimez le prix de votre produit', lead: 'Répondez aux questions : l\u2019estimation se met à jour à chaque réponse.',
    examples: 'Exemples en un clic',

    prec = p === 'idea' ? t.pi : t.pm;
  }
  const ln = [['web', t.lWeb], ['app', t.lApp], ['mobile', t.lMobile], ['bo', t.lBo], ['design', t.lDesign], ['chat', t.lChat], ['payMobile', t.lPay + ' · ' + t.lMobile], ['payApp', t.lPay + ' · ' + t.lApp], ['floorAdj', t.lFloor]].filter(([k]) => c.parts[k] > 0);
  const lines = state.answered && !c.over && ln.length ? `<ul class="lines">${ln.map(([k, l]) => `<li><span>${l}</span><span class="mono">${money(c.parts[k])}</span></li>`).join('')}</ul>` : '';
  $('#result').innerHTML = `
    <h2 id="t-res-h">${t.resTitle}</h2>
    <div aria-live="polite" aria-atomic="true"><p class="price">${text}</p><p class="precision">${prec}</p>${state.maint ? `<p class="precision">${t.maintLine}</p>` : ''}</div>
    ${lines}
    <p class="disclaimer">${t.indicative}</p>
    <div class="block"><h3>${t.inclTitle}</h3><ul class="ticks">${t.incl.map((i, n) => `<li>${n === 0 && state.sup.mobile ? t.inclStore : i}</li>`).join('')}</ul></div>
    <div class="block"><h3>${t.exclTitle}</h3><ul class="ticks no">${(state.sup.mobile ? t.excl : [t.exclWeb, t.excl[1]]).filter((_, n) => n !== 1).map(i => `<li>${i}</li>`).join('')}</ul></div>
    <div class="block"><p>${t.pay}${eff().rich === 'rich' ? ' ' + t.payRich : ''}${c.parts.design > 0 ? ' ' + t.payDesign : ''}</p></div>
    <div class="actions"><button type="button" class="btn btn--brand btn--lg btn--block" data-act="quote">${t.cta}</button><button type="button" class="btn btn--outline btn--block" data-act="copy">${t.copy}</button></div>`;
  $('#bar').innerHTML = `<p class="price" aria-hidden="true">${text}</p><button type="button" class="btn btn--brand" data-act="quote">${t.ctaShort}</button>`;
  const dr = $('#design-rate'), p = state.prec;
  if (dr) { dr.hidden = !p; if (p) { const r = { idea: PRICING.designIdea, spec: PRICING.designSpec, mockup: 0 }[p]; dr.innerHTML = `<b class="dr-title">${t.lDesign}</b><span>${r ? fill(t.designPer, { a: money(r) }) : t.designNone}</span>`; } }
  updateCalib();
}

/* ==========================================================================
   D. ÉVÉNEMENTS
   ========================================================================== */
const form = $('#form');
form.addEventListener('change', e => {
  const i = e.target; state.answered = true;
  if (i.name === 'sup') { state.sup[i.value] = i.checked; if (!state.sup.app) state.rich = 'simple'; }
  else if (i.name === 'pay') state.pay[i.value] = i.checked;
  else if (i.name === 'maint') state.maint = i.checked;
  else if (i.name === 'chat') state.chat = i.checked;
  else if (i.dataset.payn) state.payN[i.dataset.payn] = +i.value;
  else if (i.type === 'radio') state[i.name] = i.value;
  else if (i.id.endsWith('-num')) state[i.id.replace('-num', '')] = clampScreens(i.value);
  syncInputs(); updateResult();
});
form.addEventListener('input', e => {
  const m = /^(web|app|mobile|bo)-(range|num)$/.exec(e.target.id); if (!m || e.target.value === '') return;
  const k = m[1]; state[k] = clampScreens(e.target.value); state.answered = true;
  $('#' + k + (m[2] === 'range' ? '-num' : '-range')).value = state[k];
  updateResult();
});
const clampScreens = v => Math.min(250, Math.max(0, Math.round(+v) || 0));
$('#examples').addEventListener('click', e => {
  const b = e.target.closest('[data-ex]'); if (!b) return;
  const ex = EXAMPLES.find(x => x.id === b.dataset.ex);
  if (b.getAttribute('aria-pressed') === 'true') {
    Object.assign(state, JSON.parse(JSON.stringify(INITIAL)));
    document.querySelectorAll('[data-ex]').forEach(x => x.setAttribute('aria-pressed', 'false'));
    syncInputs(); updateResult(); return;
  }
  Object.assign(state, { web: 0, app: 0, mobile: 0, bo: 0, rich: 'simple', cxShare: 'half', maint: false, chat: false, pay: { mobile: false, app: false }, payN: { mobile: 1, app: 1 } }, JSON.parse(JSON.stringify(ex.s)), { answered: true });
  SUPS.forEach(k => state.sup[k] = state[k] > 0);
  document.querySelectorAll('[data-ex]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  syncInputs(); updateResult();
});
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'quote') openQuote(); else copyRecap();
});
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }
function copyRecap() {
  const txt = recap(), done = () => toast(T().copied);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fallback());
  else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); done(); }
}
function openQuote() {
  const t = T(), d = $('#dlg'); d.classList.remove('sent');
  $('#qform').innerHTML = `<h2 id="d-title">${t.dTitle}</h2><p class="help">${t.dIntro}</p>
    <div class="field" id="f-name"><label for="q-name">${t.name}</label><input id="q-name" autocomplete="name" aria-describedby="e-name"><p class="err" id="e-name">${t.errName}</p></div>
    <div class="field" id="f-mail"><label for="q-mail">${t.email}</label><input id="q-mail" type="email" autocomplete="email" aria-describedby="e-mail"><p class="err" id="e-mail">${t.errMail}</p></div>
    <div class="field"><label for="q-msg">${t.msg}</label><textarea id="q-msg"></textarea></div>
    <p class="thanks" role="status">${t.thanks}</p>
    <div class="dlg-actions"><button type="button" class="btn btn--outline" data-close>${t.close}</button><button type="submit" class="btn btn--brand">${t.send}</button></div>`;
  $('#q-msg').value = recap();
  d.showModal();
}
$('#qform').addEventListener('click', e => { if (e.target.closest('[data-close]')) $('#dlg').close(); });
$('#qform').addEventListener('submit', e => {
  e.preventDefault();
  const n = $('#q-name').value.trim(), m = $('#q-mail').value.trim();
  const okN = !!n, okM = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m);
  $('#f-name').classList.toggle('invalid', !okN); $('#f-mail').classList.toggle('invalid', !okM);
  $('#q-name').setAttribute('aria-invalid', String(!okN)); $('#q-mail').setAttribute('aria-invalid', String(!okM));
  if (!okN) $('#q-name').focus(); else if (!okM) $('#q-mail').focus(); else $('#dlg').classList.add('sent');
});

/* ==========================================================================
   E. RÉGLAGES
   ========================================================================== */
const PRICING_KEYS = [['floor'], ['floorWeb'], ['designIdea'], ['designSpec'], ['base'], ['screen'], ['screenApp'], ['screenRich'], ['boFactor'], ['complexity', 'some'], ['complexity', 'heavy'], ['share', 'few'], ['share', 'half'], ['share', 'most'], ['ceiling'], ['payFirst'], ['payExtra'], ['chat']];
const getP = k => k.reduce((o, x) => o[x], PRICING), setP = (k, v) => { const o = k.slice(0, -1).reduce((o, x) => o[x], PRICING); o[k[k.length - 1]] = v; };
const seg = (name, entries) => `<div class="seg">${entries.map(([v, l]) => `<label><input type="radio" name="${name}" value="${v}" ${ui[name] === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>`;
function buildPanel() {
  const t = T(); $('#gear').textContent = t.gear; $('#gear').setAttribute('aria-label', t.gear);
  $('#panel').innerHTML = `<h2>${t.pTitle}</h2>
    <fieldset><legend>${t.theme}</legend>${seg('theme', [['light', t.light], ['dark', t.dark]])}</fieldset>
    <fieldset><legend>${t.lang}</legend>${seg('lang', [['fr', 'Français'], ['en', 'English'], ['mg', 'Malagasy']])}</fieldset>
    <fieldset><legend>${t.bp}</legend>${seg('bp', Object.entries(t.bps))}</fieldset>
    <fieldset><legend>${t.pricing}</legend><div class="pgrid">${PRICING_KEYS.map((k, i) => `<label for="p${i}">${k.join('.')}</label><input id="p${i}" type="number" step="any" data-pk="${i}" value="${getP(k)}">`).join('')}</div><button type="button" class="btn btn--outline" id="p-reset">${t.reset}</button></fieldset>
    <fieldset><legend>${t.calib}</legend><table class="calib"><thead><tr><th></th><th>${t.target}</th><th>=</th><th>%</th></tr></thead><tbody id="calib"></tbody></table></fieldset>`;
  updateCalib();
}
function updateCalib() {
  const el = $('#calib'); if (!el) return;
  el.innerHTML = EXAMPLES.map(e => { const p = compute({ ...e.s }).price, d = (p - e.ref) / e.ref * 100; return `<tr><td>${T().ex[e.id]}</td><td>${e.ref}</td><td>${p}</td><td class="${Math.abs(d) <= 5 ? 'ok' : 'ko'}">${d > 0 ? '+' : ''}${d.toFixed(1)}</td></tr>`; }).join('');
}
$('#gear').addEventListener('click', () => { const p = $('#panel'); p.hidden = !p.hidden; $('#gear').setAttribute('aria-expanded', String(!p.hidden)); });
$('#panel').addEventListener('change', e => {
  const i = e.target;
  if (i.name === 'theme' || i.name === 'bp' || i.name === 'lang') { ui[i.name] = i.value; applyUi(); if (i.name === 'lang') { buildStatic(); buildPanel(); $('#panel [name=lang]:checked').focus(); } updateResult(); }
});
$('#panel').addEventListener('input', e => {
  const i = e.target; if (i.dataset.pk === undefined) return;
  const v = parseFloat(i.value); if (isNaN(v)) return;
  setP(PRICING_KEYS[+i.dataset.pk], v); buildStatic(); updateResult();
});
$('#panel').addEventListener('click', e => {
  if (e.target.id !== 'p-reset') return;
  PRICING_KEYS.forEach(k => setP(k, k.reduce((o, x) => o[x], DEFAULTS)));
  buildPanel(); buildStatic(); updateResult();
});
function applyUi() { document.documentElement.classList.toggle('dark', ui.theme === 'dark'); document.body.dataset.bp = ui.bp; }

/* ==========================================================================
   F. DÉMARRAGE
   ========================================================================== */
applyUi(); buildStatic(); buildPanel(); updateResult();
</script>
</body>
</html>

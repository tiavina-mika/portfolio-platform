<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Courtes, ease-out, aucune animation décorative" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--background)}.l{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--muted-foreground)}code,.m{font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"><div style="border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;display:grid;gap:4px;background:var(--card)"><b style="font-family:var(--font-mono);font-size:20px">120ms</b><code>--dur-fast</code><span style="font-size:13px;color:var(--muted-foreground)">survol, couleur, focus</span></div><div style="border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;display:grid;gap:4px;background:var(--card)"><b style="font-family:var(--font-mono);font-size:20px">180ms</b><code>--dur-base</code><span style="font-size:13px;color:var(--muted-foreground)">menus, onglets, switch</span></div><div style="border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;display:grid;gap:4px;background:var(--card)"><b style="font-family:var(--font-mono);font-size:20px">260ms</b><code>--dur-slow</code><span style="font-size:13px;color:var(--muted-foreground)">dialog, toast, panneau</span></div></div><div class="m" style="margin-top:10px">--ease-out cubic-bezier(.2,.7,.2,1) · respecter prefers-reduced-motion</div></body></html>

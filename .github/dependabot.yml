version: 2

# One pnpm entry for the whole workspace: the single root lockfile covers every app and lib.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    target-branch: develop
    commit-message:
      prefix: chore
      include: scope
    groups:
      # minor and patch bumps arrive as one PR per ecosystem instead of dozens
      nx:
        patterns: ['nx', '@nx/*']
      storybook:
        patterns: ['storybook', '@storybook/*', 'eslint-plugin-storybook']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

name: Security

# Dependency vulnerabilities and leaked secrets.
#
# `pnpm audit` is informational at first (continue-on-error): the first run will surface the existing
# backlog, which is triaged before the step is made blocking by removing that flag.
# gitleaks scans the whole history on the weekly run, and only the commits of the PR otherwise.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      # a high or critical advisory fails the job; lower severities are not reported
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the full history: a secret removed from the tree is still in a past commit
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan
        run: gitleaks git --config .gitleaks.toml --redact --verbose

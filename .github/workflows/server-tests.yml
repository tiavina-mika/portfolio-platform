name: Server Tests

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/server/**'
      - '!apps/server/**/*.md'
  push:
    branches: [develop, main]
    paths:
      - 'apps/server/**'
      - '!apps/server/**/*.md'
  workflow_dispatch:

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/server/.env.test is gitignored (contains test-only Brevo/Cloudinary/crypto keys, not
      # production secrets) — SERVER_TEST_ENV_FILE must hold its full content, one repo secret
      # instead of one per variable so this step stays in sync automatically as the file grows.
      - name: Write apps/server/.env.test
        working-directory: apps/server
        run: echo "${{ secrets.SERVER_TEST_ENV_FILE }}" > .env.test

      # the unit suite runs with coverage: it fails under the floor set in jest.unit.config.js
      - name: Run unit tests with the coverage gate
        working-directory: apps/server
        run: pnpm test:unit --coverage

      - name: Run integration tests
        working-directory: apps/server
        run: pnpm test:integration

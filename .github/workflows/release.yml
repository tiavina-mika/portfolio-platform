name: Release

# Opens, and keeps up to date, the "chore(release): version packages" PR on `develop`.
#
# While changesets are waiting in `.changeset/`, every push to `develop` re-runs
# `pnpm version-packages` on a side branch and updates that PR: it shows the next version of each app
# and the CHANGELOG.md entries about to be written. Merging it bumps the versions, writes the
# changelogs and consumes the changesets; `release-notify.yml` then posts the notes to Slack. With no
# changeset left, this workflow does nothing. Nothing is published: the apps are private packages.
#
# The PR is opened with `RELEASE_TOKEN`, a fine-grained token of a repository member, not with the
# default `GITHUB_TOKEN`: GitHub does not run workflows on a PR opened by that default token, so the
# required CI checks of `develop` would stay pending forever and the PR could never be merged.

on:
  push:
    branches: [develop]
  workflow_dispatch:

# two pushes in a row must not race on the same release branch; the second one waits
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Open or update the release PR
    runs-on: ubuntu-latest
    steps:
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN repository secret is missing: the release PR cannot be opened."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # v2 of the action is the one built for @changesets/cli v3. Pinned to the commit of the tag, not
      # the tag itself: the step holds a token that can write to the repository, and a tag can be moved
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          version-script: pnpm version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
